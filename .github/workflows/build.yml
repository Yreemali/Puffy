name: puffy build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev libpipewire-0.3-dev libx11-dev libxtst-dev
      - name: Configure
        run: cmake -S . -B build -DPUFFY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target package
